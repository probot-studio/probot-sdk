# prosdk CI (design/PORT.md sections 2, 5, 9):
#   host:    vendoring drift check (tools/upstream/wpilib.py --check), examples drift check
#            (tools/upstream/examples.py --check), host build, host header check and the
#            upstream + prosdk unit tests (prosdk_files_tests with probot-core's probot::files
#            and prosdk_match_tests with its match store, from PROBOT_CORE_REF)
#   esp32s3: the same drift check with the Arduino toolchain installed (also verifies
#            tools/upstream/arduino-macros.txt), the precompiled archive and the header check
#            (every public header after #include <Arduino.h>, exact Arduino flags)
#   examples: the archive, every examples/* sketch and the HAL link test
#            (tools/build/hal_link_test.py) compiled against probot-core at PROBOT_CORE_REF, and
#            the HAL link test again against PROBOT_CORE_OLDEST_REF (the bridge's fallbacks)
#   qemu:    manual only (workflow_dispatch): the archive and the on-target smoke test in
#            Espressif's QEMU (tools/qemu/run.sh, test/target/README.md), two boots
name: CI

on:
  push:
    branches: [stable, dev]
  pull_request:
  workflow_dispatch:

env:
  ARDUINO_CLI_VERSION: "1.5.1"
  ARDUINO_ESP32_VERSION: "3.3.10"
  # probot-core branch or tag the sketches link against (the only place it is named)
  PROBOT_CORE_REF: "feat/ds-match-info"
  # oldest probot-core the bridge supports (framework API and dashboard store, before R6-R13):
  # building against it compiles every fallback branch of src/prosdk/probot/CoreBridge.hpp
  PROBOT_CORE_OLDEST_REF: "feat/dashboard-store"

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Vendoring drift check
        run: python3 tools/upstream/wpilib.py --check

      - name: Examples drift check
        run: python3 tools/upstream/examples.py --check

      # prosdk_files_tests runs DataLogManager's share calls through core's own probot::files rules,
      # prosdk_match_tests reads core's own probot::ds match store
      - name: Check out probot-core
        uses: actions/checkout@v4
        with:
          repository: probot-studio/probot-core
          ref: ${{ env.PROBOT_CORE_REF }}
          path: .upstream/probot-core
          # a private core repository needs a read token in this secret
          token: ${{ secrets.PROBOT_CORE_TOKEN || github.token }}

      - name: Host build, header check and tests
        run: tools/build/build.sh host all header_check --test

  esp32s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install arduino-cli and Arduino-ESP32
        run: |
          set -euo pipefail
          dl=$(mktemp -d)
          archive=arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz
          curl -fsSL "https://downloads.arduino.cc/arduino-cli/${archive}" -o "$dl/$archive"
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$dl/$archive" -C "$HOME/.local/bin" arduino-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ARDUINO_ESP32_VERSION}"

      - name: Vendoring drift check (with the Arduino macro list)
        run: python3 tools/upstream/wpilib.py --check

      - name: Archive and Arduino header check
        run: tools/build/build.sh esp32s3 prosdk header_check size

  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check out probot-core
        uses: actions/checkout@v4
        with:
          repository: probot-studio/probot-core
          ref: ${{ env.PROBOT_CORE_REF }}
          path: .upstream/probot-core
          # a private core repository needs a read token in this secret
          token: ${{ secrets.PROBOT_CORE_TOKEN || github.token }}

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install arduino-cli and Arduino-ESP32
        run: |
          set -euo pipefail
          dl=$(mktemp -d)
          archive=arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz
          curl -fsSL "https://downloads.arduino.cc/arduino-cli/${archive}" -o "$dl/$archive"
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$dl/$archive" -C "$HOME/.local/bin" arduino-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ARDUINO_ESP32_VERSION}"
          # probot-core depends on it (library.properties depends=Adafruit NeoPixel)
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Archive
        run: tools/build/build.sh esp32s3 prosdk

      - name: Examples (huge_app)
        run: PROBOT_CORE="$GITHUB_WORKSPACE/.upstream/probot-core" tools/build/build.sh examples

      - name: HAL link test
        run: >-
          python3 tools/build/hal_link_test.py --out .build/hal-link --compile
          --core "$GITHUB_WORKSPACE/.upstream/probot-core"

      - name: Check out the oldest supported probot-core
        uses: actions/checkout@v4
        with:
          repository: probot-studio/probot-core
          ref: ${{ env.PROBOT_CORE_OLDEST_REF }}
          path: .upstream/probot-core-oldest
          token: ${{ secrets.PROBOT_CORE_TOKEN || github.token }}

      - name: HAL link test against the oldest supported core
        run: >-
          python3 tools/build/hal_link_test.py --out .build/hal-link-oldest --compile
          --core "$GITHUB_WORKSPACE/.upstream/probot-core-oldest"

  qemu:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja and the QEMU runtime libraries
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-2.0-0 libslirp0 libpixman-1-0 libgcrypt20 libglib2.0-0t64

      - name: Install arduino-cli and Arduino-ESP32
        run: |
          set -euo pipefail
          dl=$(mktemp -d)
          archive=arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz
          curl -fsSL "https://downloads.arduino.cc/arduino-cli/${archive}" -o "$dl/$archive"
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$dl/$archive" -C "$HOME/.local/bin" arduino-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ARDUINO_ESP32_VERSION}"

      - name: Archive
        run: tools/build/build.sh esp32s3 prosdk

      - name: QEMU (pinned, sha256-checked)
        run: tools/qemu/setup.sh

      - name: On-target smoke test (two boots)
        run: tools/qemu/run.sh --boots 2 --timeout 600

      - name: UART logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-uart
          path: |
            .build/qemu/uart-*.log
            .build/qemu/compile.log
          if-no-files-found: ignore
